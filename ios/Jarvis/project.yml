name: Jarvis
options:
  bundleIdPrefix: az.nihatomarov
  deploymentTarget:
    iOS: "16.0"
targets:
  Jarvis:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: az.nihatomarov.jarvis
        PRODUCT_NAME: Jarvis
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSMicrophoneUsageDescription: Jarvis ilə danışmaq üçün mikrofon lazımdır.
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: az.nihatomarov.jarvis
            CFBundleURLSchemes: [jarvis]
