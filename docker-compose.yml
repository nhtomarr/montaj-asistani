services:
  telegram-bot-api:
    # Öz Telegram Bot API serverimiz: 2 GB-a qədər video qəbul etmək üçün
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    env_file:
      - .env
      - data/setup.env
    environment:
      TELEGRAM_LOCAL: "1"
    volumes:
      - tgdata:/var/lib/telegram-bot-api

  app:
    build: ./app
    restart: unless-stopped
    env_file:
      - .env
      - data/setup.env
    environment:
      DATA_DIR: /data
      TELEGRAM_API_BASE: http://telegram-bot-api:8081
    volumes:
      - ./data:/data
      - tgdata:/var/lib/telegram-bot-api
    depends_on:
      - telegram-bot-api

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    # qovluq kimi qoşulur + --watch: /yenile-dən sonra Caddyfile dəyişikliyi avtomatik tətbiq olunur
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile --watch
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
    depends_on:
      - app

  ha-init:
    # Home Assistant üçün ilkin ayar + rəsmi Xiaomi Home inteqrasiyası (bir dəfə)
    image: alpine:3.20
    volumes:
      - ./data/homeassistant:/config
    command:
      - sh
      - -c
      - |
        mkdir -p /config/custom_components
        [ -f /config/configuration.yaml ] || printf 'default_config:\n' > /config/configuration.yaml
        if ! grep -q trusted_proxies /config/configuration.yaml; then
          printf '\nhttp:\n  use_x_forwarded_for: true\n  trusted_proxies:\n    - 172.16.0.0/12\n    - 10.0.0.0/8\n    - 192.168.0.0/16\n    - 127.0.0.1\n' >> /config/configuration.yaml
        fi
        if [ ! -d /config/custom_components/xiaomi_home ]; then
          wget -qO /tmp/x.zip https://github.com/XiaoMi/ha_xiaomi_home/archive/refs/heads/main.zip &&
          unzip -q /tmp/x.zip -d /tmp && cp -r /tmp/ha_xiaomi_home-main/custom_components/xiaomi_home /config/custom_components/
        fi
        if [ ! -d /config/custom_components/xiaomi_miot ]; then
          wget -qO /tmp/m.zip https://github.com/al-one/hass-xiaomi-miot/archive/refs/heads/master.zip &&
          unzip -q /tmp/m.zip -d /tmp && cp -r /tmp/hass-xiaomi-miot-master/custom_components/xiaomi_miot /config/custom_components/
        fi
        echo ok

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    environment:
      TZ: Asia/Baku
      JV_CONFIG_REV: "3"  # dəyişəndə /yenile konteyneri yenidən yaradır
    volumes:
      - ./data/homeassistant:/config
    depends_on:
      ha-init:
        condition: service_completed_successfully

volumes:
  tgdata:
  caddy_data:
